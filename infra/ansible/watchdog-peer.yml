---
# Агент production-хоста для внешнего watchdog (docs/runbooks/watchdog.md).
#
# Запуск:
#   ansible-playbook watchdog-peer.yml -e watchdog_peer_pubkey="$(cat ~/.ssh/watchdog_key.pub)"
#
# Роль ставит read-only пробу и push-таймер. Она не перезапускает bridge и не
# трогает .env.secrets: BRIDGE_STATUS_TOKEN, WATCHDOG_PUSH_URL и
# WATCHDOG_PUSH_SECRET раскладывает оператор, как и остальные секреты.

- name: Deploy external watchdog peer agent
  hosts: bridge_servers
  gather_facts: true

  pre_tasks:
    - name: Preflight | .env.secrets присутствует на сервере
      ansible.builtin.stat:
        path: "{{ project_root }}/{{ env_secrets_file }}"
      register: watchdog_env_secrets

    - name: Preflight | остановиться, если секретов нет
      ansible.builtin.fail:
        msg: >-
          {{ project_root }}/{{ env_secrets_file }} отсутствует.
          Скопируй секреты вручную перед установкой агента.
      when: not watchdog_env_secrets.stat.exists

  roles:
    - watchdog_peer
